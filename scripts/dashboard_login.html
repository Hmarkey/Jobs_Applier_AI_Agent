<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投递看板登录</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --text: #0b0b0b;
  --text-2: #52514e;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
h1 { margin: 0 0 4px; font-size: 18px; }
p { margin: 0 0 16px; color: var(--text-2); font-size: 13px; }
input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--text); font: inherit;
  font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.04em; }
button { margin-top: 12px; width: 100%; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
.err { min-height: 20px; margin: 10px 0 0; color: var(--critical); }
</style>
</head>
<body>
<form id="login">
  <h1>投递看板</h1>
  <p>输入看板主人给你的密码。</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" aria-label="密码" required autofocus>
  <button type="submit" id="go">登录</button>
  <p class="err" id="error" aria-live="polite"></p>
</form>
<script>
document.getElementById("login").addEventListener("submit", async event => {
  event.preventDefault();
  const button = document.getElementById("go");
  const error = document.getElementById("error");
  button.disabled = true;
  error.textContent = "";
  try {
    const response = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }) });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `登录失败（${response.status}）`);
    location.replace("/");
  } catch (problem) {
    error.textContent = problem.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
